id = "tassara"
name = "Tassara"
biome = "desert"
seed = 7
cell = 20
vertex_budget = 2400000
latitude = 23
heightmap = "Source/tassara.height.png"   # tools/MapAssets/tassara_height.py: the Grand Erg Oriental — seif chains running with the wind, gourds where the erg is thickest, caravan corridors between them, two Ubari lakes, a wadi, and the drowned border range
height_min = 100
height_max = 1200
bathymetry = true
natural_terrain = true
runtime_airfields = true

# A sand sea of the central Sahara, on the old caravan pistes: three airstrips in a triangle, salt lakes where
# the deflation hollows reach water, palm oases and a ksar on their shores, an oil camp in the northeast, and
# the border range half-buried along the middle.
[preset]
description = "A sea of sand with no coast: megadunes, gravel pans and a half-buried border range between three airstrips. Camp Tifa in the west, Bir Anzar across the range in the east, the army's Fort Tassara to the north."
superweapon = ""
bare = true      # no towns, rivers or plants: sand, rock, lakes and what travellers left behind
lakes = 3        # the closed hollows of the erg hold salt lakes, as the Ubari sand sea's do
wind = [0.71, 0.0, -0.71]   # the bearing the erg marches toward (x east, z north): the seif ridges run across it

[preset.lanes]
style = "none"

[preset.checks]
land = [0, 100]
strips_min = 3

[[preset.strips]]
name = "Camp Tifa"
role = "forward"
length = 1200
surface = "gravel"
x = -24000
z = -12000
heading = 70

[[preset.strips]]
name = "Bir Anzar"
role = "forward"
length = 1200
surface = "gravel"
x = 25000
z = -9000
heading = 110

[[preset.strips]]
name = "Fort Tassara"
role = "plateau"
length = 2200
surface = "asphalt"
x = 1000
z = 27000
heading = 90

