<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Megaplane original concept study: G-240 Breakwater</title>
  <desc id="desc">An original schematic plan view of a huge eight-engine aircraft with a deep centerbody and twin tail, alongside engineering assumptions, reference wingspans, and two alternative concepts. All dimensions are provisional. The drawing is not an aerodynamic or structural blueprint.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#233643" stroke-width="0.6"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#93b3bd"/></marker>
    <g id="engine"><rect x="-13" y="-30" width="26" height="70" rx="11" fill="#97a9af" stroke="#d4e2e5" stroke-width="1.5"/><ellipse cy="-24" rx="11" ry="5" fill="#1a2a32" stroke="#b8ced4"/><path d="M-7 41L-5 53H5L7 41" fill="#536c76" stroke="#90a8b0"/></g>
    <g id="smallplane" fill="#c4d3d8"><path d="M0-26L4-5L22 7V11L4 7L3 23L10 27V30L0 27L-10 30V27L-3 23L-4 7L-22 11V7L-4-5Z"/></g>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#e4edf0} .muted{fill:#99b0bc}.label{font-size:15px;letter-spacing:1.6px}.body{font-size:18px}.small{font-size:15px}.mono{font-family:Consolas,'Courier New',monospace}.rule{stroke:#38505e;stroke-width:1}.leader{stroke:#7c9da7;stroke-width:1.3;fill:none}.accent{fill:#82d3c1}.dim{stroke:#93b3bd;stroke-width:1;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1200" fill="#101b24"/>
  <rect x="0" y="0" width="1600" height="8" fill="#82d3c1"/>
  <text x="48" y="55" class="label accent">BOSCALI SUMMER / AIRCRAFT PREPRODUCTION / 17 NOV 2026</text>
  <text x="46" y="111" font-size="47" font-weight="650">G-240 BREAKWATER</text>
  <text x="820" y="107" font-size="21" class="muted">A strategic air expedition, carried by one aircraft.</text>
  <rect x="48" y="148" width="1056" height="712" rx="12" fill="#152630" stroke="#38505e"/>
  <rect x="49" y="149" width="1054" height="710" rx="12" fill="url(#grid)"/>
  <text x="72" y="184" class="label">01 / PREFERRED DIRECTION</text>
  <text x="72" y="211" class="small muted">Original plan schematic · proportions under study · wing area and thickness not represented</text>
  <path d="M580 231V805" stroke="#62818e" stroke-dasharray="7 8" opacity="0.7"/>
  <!-- Broad lifting wing and substantial carry-through region. -->
  <path d="M148 498L316 459L478 386L536 379L624 379L682 386L844 459L1012 498L1003 546L840 536L705 548L641 559L519 559L455 548L320 536L157 546Z" fill="#607d89" stroke="#c6d8df" stroke-width="2"/>
  <path d="M160 523L323 508L468 484M1000 523L837 508L692 484" class="leader"/>
  <path d="M160 538L320 528L451 539M1000 538L840 528L709 539" stroke="#b5cbd3" fill="none" stroke-width="2"/>
  <!-- Twin tail booms attach near the central structure. -->
  <path d="M492 485L511 490L523 763L510 776L498 759Z M668 485L649 490L637 763L650 776L662 759Z" fill="#708c97" stroke="#bfd1d8" stroke-width="1.8"/>
  <path d="M505 714L411 759L414 778L521 751L639 751L746 778L749 759L655 714Z" fill="#698792" stroke="#c6d8df" stroke-width="2"/>
  <path d="M508 725L516 676L525 729L521 781L512 781Z M652 725L644 676L635 729L639 781L648 781Z" fill="#bed2d9" stroke="#e3ecef"/>
  <!-- Deep cargo / mission centerbody, ordinary-size forward cockpit. -->
  <path d="M580 245Q562 250 548 292L535 359L522 413L520 510L533 598L551 662L573 712L580 785L587 712L609 662L627 598L640 510L638 413L625 359L612 292Q598 250 580 245Z" fill="#91a8b1" stroke="#dce8ec" stroke-width="2.2"/>
  <path d="M573 296L575 293H585L587 296L586 298H574Z" fill="#193a47" stroke="#d8e7ec" stroke-width="1"/>
  <path d="M580 293V298M576 293L575 298M584 293L585 298" stroke="#9fb8c2" stroke-width="0.8"/>
  <path d="M545 356Q580 340 615 356M526 425H634M525 505H635M539 590H621M553 647H607" fill="none" stroke="#587682" stroke-width="1.5"/>
  <rect x="550" y="457" width="60" height="92" rx="5" fill="#6b9298" fill-opacity="0.6" stroke="#a2e2d2" stroke-dasharray="6 4"/>
  <text x="580" y="499" text-anchor="middle" font-size="12" fill="#e0fff5">WING</text><text x="580" y="517" text-anchor="middle" font-size="12">STRUCTURE</text>
  <path d="M553 574H607L602 633H558Z" fill="#172f3b" stroke="#82d3c1" stroke-width="1.8" stroke-dasharray="5 4"/>
  <!-- Eight nacelles, explicit mirrored pairs. -->
  <use href="#engine" x="310" y="516"/><use href="#engine" x="365" y="500"/><use href="#engine" x="430" y="480"/><use href="#engine" x="481" y="466"/>
  <use href="#engine" x="850" y="516"/><use href="#engine" x="795" y="500"/><use href="#engine" x="730" y="480"/><use href="#engine" x="679" y="466"/>
  <path d="M148 595V610M1012 595V610" class="leader"/><path d="M154 602H1006" class="dim"/>
  <rect x="475" y="588" width="210" height="29" rx="6" fill="#152630"/>
  <text x="580" y="609" text-anchor="middle" class="body mono">240 m STUDY SPAN</text>
  <path d="M1043 248V782" class="dim"/><text x="1067" y="526" transform="rotate(-90 1067 526)" text-anchor="middle" class="small mono">150 m STUDY LENGTH</text>
  <path d="M572 294H452L413 276H282" class="leader"/><text x="78" y="273" class="small">Human-scale flight deck</text><text x="78" y="295" class="small muted">Scale comes from the surrounding aircraft.</text>
  <path d="M554 603H400L367 655H233" class="leader"/><text x="79" y="678" class="small accent">AFT MISSION BAY</text><text x="79" y="701" class="small muted">Release path and structure unresolved.</text>
  <path d="M798 555L848 663H956" class="leader"/><text x="798" y="688" class="small">Eight separated engine pods</text><text x="798" y="711" class="small muted">Installed thrust is a sizing target.</text>
  <use href="#smallplane" x="831" y="786" transform="translate(831 786) scale(1.63636) translate(-831 -786)"/>
  <text x="887" y="784" class="small">20 m-span marker</text><text x="887" y="808" class="small muted">Generic aircraft</text>
  <text x="72" y="835" class="label accent">WING-BORNE / SUBSONIC / CONVENTIONAL PROPULSION / FINITE PAYLOAD</text>
  <!-- Engineering card. -->
  <rect x="1128" y="148" width="424" height="712" rx="12" fill="#1c2e38" stroke="#38505e"/>
  <text x="1156" y="184" class="label accent">02 / STUDY ASSUMPTIONS</text>
  <text x="1156" y="228" class="body">240 m span · 150 m length</text><text x="1156" y="260" class="body">7,200 m² reference wing area</text>
  <text x="1156" y="292" class="body">2,400 t all-up mass allocation</text><text x="1156" y="324" class="body">180 m/s illustrative cruise</text>
  <path d="M1156 350H1524" class="rule"/>
  <text x="1156" y="388" class="label">FIRST-ORDER CONSEQUENCES</text>
  <text x="1156" y="433" font-size="34" class="mono">12.33 km</text><text x="1156" y="460" class="small muted">Turn radius at 180 m/s and 15° bank</text>
  <text x="1156" y="507" font-size="34" class="mono">~2.05 MN</text><text x="1156" y="534" class="small muted">Drag at the stated illustrative cruise point</text>
  <text x="1156" y="581" font-size="34" class="mono">41 m</text><text x="1156" y="608" class="small muted">Tip drop at 20° bank, before wing geometry</text>
  <path d="M1156 633H1524" class="rule"/>
  <text x="1156" y="667" class="label" fill="#eacb92">GATES BEFORE PRODUCTION</text>
  <text x="1156" y="699" class="body">Map and airfield fit</text><text x="1156" y="730" class="body">Structure, mass balance, propulsion</text><text x="1156" y="761" class="body">Native flight and meaningful damage</text>
  <text x="1156" y="806" class="small muted">Aerial recovery, nuclear power and</text><text x="1156" y="828" class="small muted">ground effect are separate branches.</text>
  <!-- Wingspan chart. -->
  <rect x="48" y="884" width="820" height="254" rx="12" fill="#152630" stroke="#38505e"/>
  <text x="72" y="919" class="label">03 / WINGSPAN CONTEXT</text>
  <text x="72" y="952" class="small muted">Lockheed study*</text><path d="M265 947H775" stroke="#728b98" stroke-width="9"/><text x="790" y="952" class="small mono">340</text>
  <text x="72" y="985" class="small accent">BREAKWATER*</text><path d="M265 980H625" stroke="#82d3c1" stroke-width="9"/><text x="641" y="985" class="small mono">240</text>
  <text x="72" y="1018" class="small muted">Pelican*</text><path d="M265 1013H493.6" stroke="#728b98" stroke-width="9"/><text x="510" y="1018" class="small mono">152.4</text>
  <text x="72" y="1051" class="small">Roc</text><path d="M265 1046H441" stroke="#bdcfd6" stroke-width="9"/><text x="458" y="1051" class="small mono">117.35</text>
  <text x="72" y="1084" class="small">An-225</text><path d="M265 1079H397.6" stroke="#bdcfd6" stroke-width="9"/><text x="414" y="1084" class="small mono">88.4</text>
  <text x="72" y="1117" class="small muted">Metres · *unbuilt proposal / study assumption · source links in Research/01-real-aircraft.md</text>
  <!-- Alternative silhouette thumbnails, not dimensioned. -->
  <rect x="892" y="884" width="660" height="254" rx="12" fill="#152630" stroke="#38505e"/>
  <text x="916" y="919" class="label">04 / ALTERNATIVES TO PRESERVE</text>
  <path d="M931 991L1043 964L1149 991L1133 1001L1043 993L949 1001Z" fill="#6c8996" stroke="#c2d4dc"/><path d="M1043 945L1054 978L1050 1021H1036L1033 978Z" fill="#a1b8c1"/><path d="M927 1033H1155" stroke="#54858f" stroke-width="2"/>
  <text x="931" y="1068" class="body">B / LOWTIDE</text><text x="931" y="1094" class="small muted">Maritime ground-effect route.</text><text x="931" y="1117" class="small muted">Waves and clearance dominate.</text>
  <path d="M1197 995L1349 951L1504 995L1473 1013L1350 990L1227 1013Z" fill="#6c8996" stroke="#c2d4dc"/><path d="M1349 944L1368 971L1360 1032H1339L1331 971Z" fill="#a1b8c1"/>
  <text x="1197" y="1068" class="body">C / SKYKEEP</text><text x="1197" y="1094" class="small muted">Extreme airborne-base fantasy.</text><text x="1197" y="1117" class="small muted">Power, heat and shielding unresolved.</text>
  <text x="48" y="1173" class="small muted">ORIGINAL VECTOR STUDY / PREPRODUCTION ONLY / No model, flight capability, structural sizing or gameplay implementation established.</text>
</svg>
