<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="t d">
<title id="t">Boscali Summer flight plan</title>
<desc id="d">The releases drawn as a flight plan. Flown: 0.1.1 first build (1 September 2026), 0.1.3 ground war (25 September), 0.2.0 first public alpha (10 October), 0.2.1 visor HUD (12 October) and 0.2.2 radio nets (13 October), which is the present position. Planned: 0.3 Counterplay, 0.4 Fronts, 0.5 Campaign, and at the end of the route the Flying Fortress.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop offset="0" stop-color="#061017"/><stop offset="1" stop-color="#0b1d25"/></linearGradient>
<radialGradient id="glow" cx=".89" cy=".28" r=".45"><stop offset="0" stop-color="#f0b56e" stop-opacity=".1"/><stop offset="1" stop-color="#f0b56e" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7fd6cf" stroke-opacity=".05"/></pattern>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V9" stroke="#f0a35e" stroke-opacity=".1" stroke-width="2"/></pattern>
<pattern id="hatchF" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" stroke="#f0b56e" stroke-opacity=".55" stroke-width="1.6"/></pattern>
<clipPath id="frame"><rect width="1000" height="440" rx="12"/></clipPath>
<path id="jet" d="M0-9L2.2-2.5 9 2.2V4.4L2.2 2.4 1.5 6.8 3.6 8.6V9.8L0 8.9-3.6 9.8V8.6L-1.5 6.8-2.2 2.4-9 4.4V2.2L-2.2-2.5Z"/>
<path id="wp" d="M0-7L7 0 0 7-7 0Z"/>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
.k{font-size:12px;font-weight:700;letter-spacing:2px}
.s{font-size:11px;font-weight:700;letter-spacing:1.4px}
.r{font-size:11px;letter-spacing:1px;white-space:pre;fill:#8fb4b8}
.lbl text{text-anchor:middle;paint-order:stroke;stroke:#07141b;stroke-width:4px;stroke-linejoin:round}
.v{font:800 20px Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#eef7f6}
.c{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#7fd6cf}
.dt{font-size:11px;letter-spacing:.6px;fill:#6d9199}
.p .v{fill:#f6c88f}.p .c{fill:#f0b56e}
.flown{stroke-dasharray:100;animation:draw 2.4s ease-out both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.plan{animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-17}}
.pulse{transform-origin:0 0;animation:pulse 3.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.ring{transform-origin:0 0;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ghost{offset-path:path("M440 268L552 198 656 248 752 180 821 152");offset-rotate:auto 90deg;animation:fly 14s linear infinite}
@keyframes fly{0%{offset-distance:0%;opacity:0}8%{opacity:.55}88%{opacity:.55}100%{offset-distance:100%;opacity:0}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flicker{animation:flicker 1.6s ease-in-out infinite alternate}
@keyframes flicker{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ghost{display:none}}
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="440" fill="url(#bg)"/>
<rect width="1000" height="440" fill="url(#grid)"/>
<path d="M500 0H1000V440H400Z" fill="url(#hatch)"/>
<rect width="1000" height="440" fill="url(#glow)"/>
<path d="M500 0L400 440" stroke="#f0b56e" stroke-opacity=".3" stroke-dasharray="2 7"/>
</g>
<rect x=".5" y=".5" width="999" height="439" rx="12" fill="none" stroke="#17333c"/>
<path d="M16 38V16H38M962 16H984V38M16 402V424H38M962 424H984V402" fill="none" stroke="#7fd6cf" stroke-opacity=".45" stroke-width="1.5"/>

<!-- top strip -->
<text x="48" y="36" class="k"><tspan fill="#f0b56e">FLIGHT PLAN</tspan><tspan dx="10" fill="#4f737b">/</tspan><tspan dx="10" fill="#7fd6cf">BOSCALI SUMMER</tspan></text>
<rect x="48" y="46" width="34" height="2" fill="#f0b56e"/>
<text x="938" y="36" class="k" text-anchor="end"><tspan fill="#6d9199">PRESENT POSITION</tspan><tspan dx="10" fill="#f6c88f">0.2.2 ALPHA</tspan></text>
<circle class="blink" cx="948" cy="32" r="3.5" fill="#f0b56e"/>
<text x="470" y="78" class="s" text-anchor="end" fill="#7fd6cf">FLOWN</text>
<text x="497" y="78" class="s" fill="#f0b56e">PLANNED</text>

<!-- route: flown legs, then planned legs -->
<path d="M84 300L160 238 254 286 346 222 440 268" fill="none" stroke="#7fd6cf" stroke-opacity=".13" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
<path class="flown" pathLength="100" d="M84 300L160 238 254 286 346 222 440 268" fill="none" stroke="#7fd6cf" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path class="plan" d="M440 268L552 198 656 248 752 180 821 152" fill="none" stroke="#f0b56e" stroke-width="2" stroke-dasharray="9 8" stroke-linejoin="round"/>
<g class="ghost"><use href="#jet" fill="#f6c88f"/></g>

<!-- waypoints -->
<g fill="#7fd6cf" stroke="#061017" stroke-width="2">
<use href="#wp" x="84" y="300"/><use href="#wp" x="160" y="238"/><use href="#wp" x="254" y="286"/><use href="#wp" x="346" y="222"/>
</g>
<use href="#wp" transform="translate(254 286) scale(1.9)" fill="none" stroke="#7fd6cf" stroke-opacity=".7" stroke-width=".8"/>
<g fill="#0a1a22" stroke="#f0b56e" stroke-width="1.8">
<use href="#wp" x="552" y="198"/><use href="#wp" x="656" y="248"/><use href="#wp" x="752" y="180"/>
</g>

<!-- present position -->
<g transform="translate(440 268)">
<circle class="pulse" r="12" fill="none" stroke="#bff6ee" stroke-width="1.5"/>
<circle r="15" fill="#061017" fill-opacity=".9" stroke="#bff6ee" stroke-opacity=".55"/>
<use href="#jet" transform="rotate(58) scale(1.3)" fill="#bff6ee"/>
</g>

<!-- destination -->
<g transform="translate(890 124)">
<circle class="ring" r="70" fill="none" stroke="#f0b56e" stroke-opacity=".5" stroke-dasharray="2 7"/>
<circle r="44" fill="none" stroke="#f0b56e" stroke-opacity=".16"/>
<circle class="pulse" r="27" fill="none" stroke="#f0b56e" stroke-width="1.2"/>
<path transform="rotate(-14)" d="M0-27L9-19 60 5V13L41 9 31 18 21 10 10 19 0 11-10 19-21 10-31 18-41 9-60 13V5L-9-19Z" fill="#0a1a22"/>
<path transform="rotate(-14)" d="M0-27L9-19 60 5V13L41 9 31 18 21 10 10 19 0 11-10 19-21 10-31 18-41 9-60 13V5L-9-19Z" fill="url(#hatchF)" stroke="#f6c88f" stroke-width="1.5" stroke-linejoin="round"/>
<g fill="none" stroke="#f0b56e" stroke-opacity=".7" stroke-width="2.4">
<use href="#wp" transform="translate(-38 -40) scale(.45)"/><use href="#wp" transform="translate(-50 34) scale(.45)"/><use href="#wp" transform="translate(30 48) scale(.45)"/><use href="#wp" transform="translate(44 -38) scale(.45)"/>
</g>
</g>

<!-- labels -->
<g class="lbl">
<text x="84" y="336" class="v">0.1.1</text><text x="84" y="352" class="c">FIRST BUILD</text><text x="84" y="367" class="dt">1 SEP 2026</text>
<text x="160" y="189" class="v">0.1.3</text><text x="160" y="205" class="c">GROUND WAR</text><text x="160" y="220" class="dt">25 SEP</text>
<text x="254" y="322" class="v">0.2.0</text><text x="254" y="338" class="c">PUBLIC ALPHA</text><text x="254" y="353" class="dt">10 OCT</text>
<text x="346" y="173" class="v">0.2.1</text><text x="346" y="189" class="c">VISOR HUD</text><text x="346" y="204" class="dt">12 OCT</text>
<text x="440" y="308" class="v">0.2.2</text><text x="440" y="324" class="c">RADIO NETS</text><text x="440" y="339" class="dt">13 OCT</text>
<g class="p">
<text x="552" y="161" class="v">0.3</text><text x="552" y="178" class="c">COUNTERPLAY</text>
<text x="656" y="286" class="v">0.4</text><text x="656" y="303" class="c">FRONTS</text>
<text x="752" y="143" class="v">0.5</text><text x="752" y="160" class="c">CAMPAIGN</text>
</g>
<text x="890" y="216" class="c" style="font-size:12.5px;letter-spacing:1.5px;fill:#f6c88f">FLYING FORTRESS</text>
</g>
<rect x="388" y="349" width="104" height="19" rx="3" fill="#f0b56e" fill-opacity=".12" stroke="#f0b56e" stroke-opacity=".8"/>
<text x="440" y="362.5" class="s" text-anchor="middle" fill="#f6c88f" style="font-size:10.5px;letter-spacing:1px">YOU ARE HERE</text>
<g class="flicker" transform="rotate(-4 890 238)">
<rect x="844" y="228" width="92" height="19" rx="2" fill="#e8806a" fill-opacity=".08" stroke="#e8806a" stroke-width="1.2"/>
<text x="890" y="241.5" class="s" text-anchor="middle" fill="#e8806a" style="font-size:10.5px">CLASSIFIED</text>
</g>

<!-- readout -->
<text class="r" text-anchor="end"><tspan x="952" y="318">DEST  FLYING FORTRESS</tspan><tspan x="952" y="334">ETA  WHEN IT FLIES</tspan><tspan x="952" y="350">WPTS  5 PASSED / 4 AHEAD</tspan></text>

<!-- bottom strip -->
<path d="M48 392H952" stroke="#17333c"/>
<use href="#wp" transform="translate(54 414) scale(.8)" fill="#7fd6cf"/>
<text x="66" y="418" class="s" fill="#8fb4b8">FLOWN</text>
<use href="#wp" transform="translate(140 414) scale(.8)" fill="#0a1a22" stroke="#f0b56e" stroke-width="2"/>
<text x="152" y="418" class="s" fill="#8fb4b8">PLANNED</text>
<text x="952" y="418" class="s" text-anchor="end" fill="#6d9199">AT 0.2.2: 946 COMMITS / 44 DAYS SINCE FIRST COMMIT</text>
</svg>
