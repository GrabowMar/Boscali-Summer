<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="t d">
<title id="t">Boscali Summer flight plan</title>
<desc id="d">The major releases drawn as a flight plan. Flown: 0.1 first build (radio and forest fires, September 2026). Present position: 0.2 public alpha (October 2026), everything in as experimental. Planned: 0.3 UI polish and OPS finished, 0.4 game mechanics and more weapons, 0.5 and 0.6 game mechanics, 0.7 the Flying Fortress, 0.8 more maps through a custom maps mod, 0.9 campaign, 1.0 final polish and release.</desc>
<!-- Major releases only. Minor updates (0.2.x) ship between waypoints and are not drawn here. -->
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop offset="0" stop-color="#061017"/><stop offset="1" stop-color="#0b1d25"/></linearGradient>
<radialGradient id="glow" cx=".62" cy=".38" r=".35"><stop offset="0" stop-color="#f0b56e" stop-opacity=".1"/><stop offset="1" stop-color="#f0b56e" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7fd6cf" stroke-opacity=".05"/></pattern>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V9" stroke="#f0a35e" stroke-opacity=".1" stroke-width="2"/></pattern>
<pattern id="hatchF" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V5" stroke="#f0b56e" stroke-opacity=".55" stroke-width="1.6"/></pattern>
<clipPath id="frame"><rect width="1000" height="440" rx="12"/></clipPath>
<path id="jet" d="M0-9L2.2-2.5 9 2.2V4.4L2.2 2.4 1.5 6.8 3.6 8.6V9.8L0 8.9-3.6 9.8V8.6L-1.5 6.8-2.2 2.4-9 4.4V2.2L-2.2-2.5Z"/>
<path id="wp" d="M0-7L7 0 0 7-7 0Z"/>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
.k{font-size:12px;font-weight:700;letter-spacing:2px}
.s{font-size:11px;font-weight:700;letter-spacing:1.4px}
.r{font-size:11px;letter-spacing:1px;white-space:pre;fill:#8fb4b8}
.lbl text{text-anchor:middle;paint-order:stroke;stroke:#07141b;stroke-width:4px;stroke-linejoin:round}
.v{font:800 20px Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;fill:#eef7f6}
.c{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#7fd6cf}
.dt{font-size:11px;letter-spacing:.6px;fill:#6d9199}
.p .v{fill:#f6c88f}.p .c{fill:#f0b56e}.p .dt{fill:#9a7f62}
.flown{stroke-dasharray:100;animation:draw 2.4s ease-out both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.plan{animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-17}}
.pulse{transform-origin:0 0;animation:pulse 3.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.ring{transform-origin:0 0;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ghost{offset-path:path("M162 290L254 200 346 290 438 200 530 290 622 170 714 290 806 200 898 290");offset-rotate:auto 90deg;animation:fly 22s linear infinite}
@keyframes fly{0%{offset-distance:0%;opacity:0}5%{opacity:.55}93%{opacity:.55}100%{offset-distance:100%;opacity:0}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flicker{animation:flicker 1.6s ease-in-out infinite alternate}
@keyframes flicker{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ghost{display:none}}
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="440" fill="url(#bg)"/>
<rect width="1000" height="440" fill="url(#grid)"/>
<path d="M250 0H1000V440H215Z" fill="url(#hatch)"/>
<rect width="1000" height="440" fill="url(#glow)"/>
<path d="M250 0L215 440" stroke="#f0b56e" stroke-opacity=".3" stroke-dasharray="2 7"/>
</g>
<rect x=".5" y=".5" width="999" height="439" rx="12" fill="none" stroke="#17333c"/>
<path d="M16 38V16H38M962 16H984V38M16 402V424H38M962 424H984V402" fill="none" stroke="#7fd6cf" stroke-opacity=".45" stroke-width="1.5"/>

<!-- top strip -->
<text x="48" y="36" class="k"><tspan fill="#f0b56e">FLIGHT PLAN</tspan><tspan dx="10" fill="#4f737b">/</tspan><tspan dx="10" fill="#7fd6cf">BOSCALI SUMMER</tspan></text>
<rect x="48" y="46" width="34" height="2" fill="#f0b56e"/>
<text x="938" y="36" class="k" text-anchor="end"><tspan fill="#6d9199">PRESENT POSITION</tspan><tspan dx="10" fill="#f6c88f">0.2 ALPHA</tspan></text>
<circle class="blink" cx="948" cy="32" r="3.5" fill="#f0b56e"/>
<text x="232" y="78" class="s" text-anchor="end" fill="#7fd6cf">FLOWN</text>
<text x="256" y="78" class="s" fill="#f0b56e">PLANNED</text>

<!-- route: flown leg, then planned legs -->
<path d="M70 200L162 290" fill="none" stroke="#7fd6cf" stroke-opacity=".13" stroke-width="9" stroke-linecap="round"/>
<path class="flown" pathLength="100" d="M70 200L162 290" fill="none" stroke="#7fd6cf" stroke-width="2.5" stroke-linecap="round"/>
<path class="plan" d="M162 290L254 200 346 290 438 200 530 290 622 170 714 290 806 200 898 290" fill="none" stroke="#f0b56e" stroke-width="2" stroke-dasharray="9 8" stroke-linejoin="round"/>
<g class="ghost"><use href="#jet" fill="#f6c88f"/></g>

<!-- waypoints -->
<use href="#wp" x="70" y="200" fill="#7fd6cf" stroke="#061017" stroke-width="2"/>
<g fill="#0a1a22" stroke="#f0b56e" stroke-width="1.8">
<use href="#wp" x="254" y="200"/><use href="#wp" x="346" y="290"/><use href="#wp" x="438" y="200"/><use href="#wp" x="530" y="290"/><use href="#wp" x="714" y="290"/><use href="#wp" x="806" y="200"/>
</g>

<!-- present position -->
<g transform="translate(162 290)">
<circle class="pulse" r="12" fill="none" stroke="#bff6ee" stroke-width="1.5"/>
<circle r="15" fill="#061017" fill-opacity=".9" stroke="#bff6ee" stroke-opacity=".55"/>
<use href="#jet" transform="rotate(44) scale(1.3)" fill="#bff6ee"/>
</g>

<!-- 0.7: the Flying Fortress -->
<g transform="translate(622 170)">
<circle r="44" fill="none" stroke="#f0b56e" stroke-opacity=".16"/>
<circle class="pulse" r="24" fill="none" stroke="#f0b56e" stroke-width="1.2"/>
<g transform="rotate(-14) scale(.85)">
<path d="M0-27L9-19 60 5V13L41 9 31 18 21 10 10 19 0 11-10 19-21 10-31 18-41 9-60 13V5L-9-19Z" fill="#0a1a22"/>
<path d="M0-27L9-19 60 5V13L41 9 31 18 21 10 10 19 0 11-10 19-21 10-31 18-41 9-60 13V5L-9-19Z" fill="url(#hatchF)" stroke="#f6c88f" stroke-width="1.6" stroke-linejoin="round"/>
</g>
</g>

<!-- 1.0: destination -->
<g transform="translate(898 290)">
<circle class="ring" r="30" fill="none" stroke="#f0b56e" stroke-opacity=".55" stroke-dasharray="2 6"/>
<circle class="pulse" r="12" fill="none" stroke="#f0b56e" stroke-width="1.2"/>
<use href="#wp" transform="scale(1.4)" fill="#f0b56e" stroke="#061017" stroke-width="1.4"/>
</g>

<!-- labels -->
<g class="lbl">
<text x="70" y="154" class="v">0.1</text><text x="70" y="170" class="c">RADIO + FIRES</text><text x="70" y="185" class="dt">SEP 2026</text>
<text x="162" y="331" class="v">0.2</text><text x="162" y="347" class="c">PUBLIC ALPHA</text><text x="162" y="362" class="dt">OCT 2026</text>
<g class="p">
<text x="254" y="154" class="v">0.3</text><text x="254" y="170" class="c">UI + OPS</text><text x="254" y="185" class="dt">POLISH, FINISH</text>
<text x="346" y="331" class="v">0.4</text><text x="346" y="347" class="c">WEAPONS</text><text x="346" y="362" class="dt">+ MECHANICS</text>
<text x="438" y="154" class="v">0.5</text><text x="438" y="170" class="c">MECHANICS</text><text x="438" y="185" class="dt">POLISH</text>
<text x="530" y="331" class="v">0.6</text><text x="530" y="347" class="c">MECHANICS</text><text x="530" y="362" class="dt">POLISH</text>
<text x="622" y="96" class="v">0.7</text><text x="622" y="112" class="c" style="fill:#f6c88f">FLYING FORTRESS</text>
<text x="714" y="331" class="v">0.8</text><text x="714" y="347" class="c">MAPS</text><text x="714" y="362" class="dt">CUSTOM MAPS MOD</text>
<text x="806" y="154" class="v">0.9</text><text x="806" y="170" class="c">CAMPAIGN</text><text x="806" y="185" class="dt">WAR CARRIES OVER</text>
<text x="898" y="339" class="v">1.0</text><text x="898" y="355" class="c">RELEASE</text><text x="898" y="370" class="dt">FINAL POLISH</text>
</g>
</g>
<rect x="110" y="372" width="104" height="19" rx="3" fill="#f0b56e" fill-opacity=".12" stroke="#f0b56e" stroke-opacity=".8"/>
<text x="162" y="385.5" class="s" text-anchor="middle" fill="#f6c88f" style="font-size:10.5px;letter-spacing:1px">YOU ARE HERE</text>
<g class="flicker" transform="rotate(-4 622 232)">
<rect x="576" y="222" width="92" height="19" rx="2" fill="#0a1a22"/>
<rect x="576" y="222" width="92" height="19" rx="2" fill="#e8806a" fill-opacity=".08" stroke="#e8806a" stroke-width="1.2"/>
<text x="622" y="235.5" class="s" text-anchor="middle" fill="#e8806a" style="font-size:10.5px">CLASSIFIED</text>
</g>

<!-- readout -->
<text class="r" text-anchor="end"><tspan x="952" y="66">DEST  1.0 RELEASE</tspan><tspan x="952" y="82">VIA  FLYING FORTRESS</tspan><tspan x="952" y="98">WPTS  2 FLOWN / 8 AHEAD</tspan></text>

<!-- bottom strip -->
<path d="M48 400H952" stroke="#17333c"/>
<use href="#wp" transform="translate(54 418) scale(.8)" fill="#7fd6cf"/>
<text x="66" y="422" class="s" fill="#8fb4b8">FLOWN</text>
<use href="#wp" transform="translate(140 418) scale(.8)" fill="#0a1a22" stroke="#f0b56e" stroke-width="2"/>
<text x="152" y="422" class="s" fill="#8fb4b8">PLANNED</text>
<text x="952" y="422" class="s" text-anchor="end" fill="#6d9199">MAJOR RELEASES ONLY / NO DATES AHEAD</text>
</svg>
