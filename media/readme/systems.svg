<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img" aria-labelledby="t d">
<title id="t">Boscali Summer systems check, 0.2.2 alpha</title>
<desc id="d">A rough status board. Flying: wing and WMC, TAC BOARD HUD, C ring, weather, pilot immersion, fire and destruction. Rough or experimental: radio nets (rebuilt, not yet played through), VANGUARD, towns and trenches, STR command map, OPS fronts, airborne. Unreliable: multiplayer. Not built: campaign save. Flying Fortress: classified.</desc>
<!-- To retune a bar: change the width of its second rect. One segment is 10, a full bar is 160. -->
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop offset="0" stop-color="#061017"/><stop offset="1" stop-color="#0b1d25"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7fd6cf" stroke-opacity=".04"/></pattern>
<pattern id="hatchF" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#f0b56e" stroke-opacity=".5" stroke-width="2"/></pattern>
<pattern id="seg" x="6" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="7" height="10" fill="#fff"/></pattern>
<mask id="segs" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="424"><rect width="1000" height="424" fill="url(#seg)"/></mask>
<clipPath id="frame"><rect width="1000" height="424" rx="12"/></clipPath>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
.k{font-size:12px;font-weight:700;letter-spacing:2px}
.s{font-size:11px;font-weight:700;letter-spacing:1.2px}
.h{font-size:10.5px;letter-spacing:2px;fill:#4f737b}
.n{font-size:12.5px;font-weight:700;letter-spacing:.6px;fill:#eef7f6}
.d{font-size:10.5px;letter-spacing:.2px;fill:#6d9199}
.tr{fill:#15303a}
.fly{fill:#7fd6cf}.rgh{fill:#f0b56e}.bad{fill:#e8806a}.off{fill:#5d8088}
.g{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flicker{animation:flicker 1.6s ease-in-out infinite alternate}
@keyframes flicker{from{opacity:.55}to{opacity:1}}
.march{animation:march 1.2s linear infinite}
@keyframes march{to{transform:translateX(8.485px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="424" fill="url(#bg)"/>
<rect width="1000" height="424" fill="url(#grid)"/>
</g>
<rect x=".5" y=".5" width="999" height="423" rx="12" fill="none" stroke="#17333c"/>
<path d="M16 38V16H38M962 16H984V38M16 386V408H38M962 408H984V386" fill="none" stroke="#7fd6cf" stroke-opacity=".45" stroke-width="1.5"/>

<!-- top strip -->
<text x="48" y="36" class="k"><tspan fill="#f0b56e">SYSTEMS CHECK</tspan><tspan dx="10" fill="#4f737b">/</tspan><tspan dx="10" fill="#7fd6cf">0.2.2 ALPHA</tspan></text>
<rect x="48" y="46" width="34" height="2" fill="#f0b56e"/>
<g class="s" fill="#8fb4b8">
<rect x="590" y="27" width="9" height="9" class="fly"/><text x="605" y="36">FLYING</text>
<rect x="670" y="27" width="9" height="9" class="rgh"/><text x="685" y="36">ROUGH</text>
<rect x="742" y="27" width="9" height="9" class="bad"/><text x="757" y="36">UNRELIABLE</text>
<rect x="852" y="27" width="9" height="9" class="off"/><text x="867" y="36">NOT BUILT</text>
</g>

<text x="48" y="78" class="h">IN THE COCKPIT</text><path d="M178 74H472" stroke="#17333c"/>
<text x="528" y="78" class="h">OVER THE FRONT</text><path d="M658 74H952" stroke="#17333c"/>

<!-- bars: track, then value -->
<g mask="url(#segs)">
<rect class="tr" x="206" y="98" width="160" height="10"/><rect class="g fly" x="206" y="98" width="130" height="10"/>
<rect class="tr" x="206" y="138" width="160" height="10"/><rect class="g fly" x="206" y="138" width="140" height="10" style="animation-delay:.06s"/>
<rect class="tr" x="206" y="178" width="160" height="10"/><rect class="g fly" x="206" y="178" width="130" height="10" style="animation-delay:.12s"/>
<rect class="tr" x="206" y="218" width="160" height="10"/><rect class="g fly" x="206" y="218" width="120" height="10" style="animation-delay:.18s"/>
<rect class="tr" x="206" y="258" width="160" height="10"/><rect class="g fly" x="206" y="258" width="110" height="10" style="animation-delay:.24s"/>
<rect class="tr" x="206" y="298" width="160" height="10"/><rect class="g rgh" x="206" y="298" width="70" height="10" style="animation-delay:.3s"/>
<rect class="tr" x="206" y="338" width="160" height="10"/><rect class="g rgh" x="206" y="338" width="100" height="10" style="animation-delay:.36s"/>

<rect class="tr" x="686" y="98" width="160" height="10"/><rect class="g fly" x="686" y="98" width="130" height="10" style="animation-delay:.03s"/>
<rect class="tr" x="686" y="138" width="160" height="10"/><rect class="g rgh" x="686" y="138" width="100" height="10" style="animation-delay:.09s"/>
<rect class="tr" x="686" y="178" width="160" height="10"/><rect class="g rgh" x="686" y="178" width="90" height="10" style="animation-delay:.15s"/>
<rect class="tr" x="686" y="218" width="160" height="10"/><rect class="g rgh" x="686" y="218" width="80" height="10" style="animation-delay:.21s"/>
<rect class="tr" x="686" y="258" width="160" height="10"/><rect class="g rgh" x="686" y="258" width="80" height="10" style="animation-delay:.27s"/>
<rect class="tr" x="686" y="298" width="160" height="10"/><rect class="g bad" x="686" y="298" width="40" height="10" style="animation-delay:.33s"/>
<rect class="tr" x="686" y="338" width="160" height="10"/>

<rect class="tr" x="206" y="388" width="640" height="10"/>
</g>
<g clip-path="url(#frame)"><svg x="206" y="388" width="640" height="10" overflow="hidden"><rect class="march" x="-10" width="660" height="10" fill="url(#hatchF)"/></svg></g>

<!-- left column -->
<text x="48" y="108" class="n">WING / WMC</text><text x="48" y="123" class="d">wingmen, formations, loadouts, orders</text><text x="378" y="108" class="s fly">FLYING</text>
<text x="48" y="148" class="n">TAC BOARD HUD</text><text x="48" y="163" class="d">visor layout, nine automatic pages</text><text x="378" y="148" class="s fly">FLYING</text>
<text x="48" y="188" class="n">C RING</text><text x="48" y="203" class="d">ten categories, keyboard, mouse or stick</text><text x="378" y="188" class="s fly">FLYING</text>
<text x="48" y="228" class="n">WEATHER</text><text x="48" y="243" class="d">47 skies, storms, MET OFFICE console</text><text x="378" y="228" class="s fly">FLYING</text>
<text x="48" y="268" class="n">PILOT IMMERSION</text><text x="48" y="283" class="d">body, breathing, G cues, night vision</text><text x="378" y="268" class="s fly">FLYING</text>
<text x="48" y="308" class="n">RADIO NETS</text><text x="48" y="323" class="d">rebuilt in 0.2.2, not played through yet</text><text x="378" y="308" class="s rgh">UNTESTED</text>
<text x="48" y="348" class="n">VANGUARD</text><text x="48" y="363" class="d">eleven systems, needs Blueprinter</text><text x="378" y="348" class="s rgh">EXPERIMENTAL</text>

<!-- right column -->
<text x="528" y="108" class="n">FIRE + DESTRUCTION</text><text x="528" y="123" class="d">fires, wrecks, ruins, craters</text><text x="858" y="108" class="s fly">FLYING</text>
<text x="528" y="148" class="n">TOWNS + TRENCHES</text><text x="528" y="163" class="d">garrisons, rooftop nests, trench lines</text><text x="858" y="148" class="s rgh">ROUGH</text>
<text x="528" y="188" class="n">STR COMMAND MAP</text><text x="528" y="203" class="d">sortie tie-in and wave desk not built</text><text x="858" y="188" class="s rgh">ROUGH</text>
<text x="528" y="228" class="n">OPS FRONTS</text><text x="528" y="243" class="d">SPACE / CYBER / SOF, redesign planned</text><text x="858" y="228" class="s rgh">ROUGH</text>
<text x="528" y="268" class="n">AIRBORNE</text><text x="528" y="283" class="d">HALO jumps, fast-rope, rappel</text><text x="858" y="268" class="s rgh">EXPERIMENTAL</text>
<text x="528" y="308" class="n">MULTIPLAYER</text><text x="528" y="323" class="d">same version for everyone, still rough</text><text x="858" y="308" class="s bad">UNRELIABLE</text>
<text x="528" y="348" class="n">CAMPAIGN SAVE</text><text x="528" y="363" class="d">the war carrying over, planned for 0.5</text><text x="858" y="348" class="s off">NOT BUILT</text>

<!-- the far end of the plan -->
<path d="M48 376H952" stroke="#17333c"/>
<text x="48" y="398" class="n" style="fill:#f6c88f">FLYING FORTRESS</text>
<text x="858" y="398" class="s bad flicker">CLASSIFIED</text>
</svg>
