<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" role="img" aria-labelledby="t d">
<title id="t">Boscali Summer systems check, 0.2 alpha</title>
<desc id="d">A rough estimate of how complete each system is against 1.0. Nothing is finished. Rough: wing and WMC 60 percent, weather 60, TAC BOARD HUD 55, C ring 55, fire and destruction 55, pilot immersion 45, towns and trenches 45, OPS fronts 40, VANGUARD 35, STR command map 35, radio nets 25, airborne 25. Unreliable: multiplayer 20. Not built: campaign 10. Flying Fortress: classified, planned for 0.7.</desc>
<!-- To retune a bar: set the width of its second rect to percent x 1.6 (a full bar is 160) and update the percent text. -->
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop offset="0" stop-color="#061017"/><stop offset="1" stop-color="#0b1d25"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7fd6cf" stroke-opacity=".04"/></pattern>
<pattern id="hatchF" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#f0b56e" stroke-opacity=".5" stroke-width="2"/></pattern>
<pattern id="seg" x="6" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="7" height="10" fill="#fff"/></pattern>
<mask id="segs" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="424"><rect width="1000" height="424" fill="url(#seg)"/></mask>
<clipPath id="frame"><rect width="1000" height="424" rx="12"/></clipPath>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
.k{font-size:12px;font-weight:700;letter-spacing:2px}
.s{font-size:11px;font-weight:700;letter-spacing:1.2px}
.h{font-size:10.5px;letter-spacing:2px;fill:#4f737b}
.n{font-size:12.5px;font-weight:700;letter-spacing:.6px;fill:#eef7f6}
.d{font-size:10.5px;letter-spacing:.2px;fill:#6d9199}
.tr{fill:#15303a}
.rgh{fill:#f0b56e}.bad{fill:#e8806a}.off{fill:#5d8088}
.g{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.flicker{animation:flicker 1.6s ease-in-out infinite alternate}
@keyframes flicker{from{opacity:.55}to{opacity:1}}
.march{animation:march 1.2s linear infinite}
@keyframes march{to{transform:translateX(8.485px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="424" fill="url(#bg)"/>
<rect width="1000" height="424" fill="url(#grid)"/>
</g>
<rect x=".5" y=".5" width="999" height="423" rx="12" fill="none" stroke="#17333c"/>
<path d="M16 38V16H38M962 16H984V38M16 386V408H38M962 408H984V386" fill="none" stroke="#7fd6cf" stroke-opacity=".45" stroke-width="1.5"/>

<!-- top strip -->
<text x="48" y="36" class="k"><tspan fill="#f0b56e">SYSTEMS CHECK</tspan><tspan dx="10" fill="#4f737b">/</tspan><tspan dx="10" fill="#7fd6cf">0.2 ALPHA</tspan></text>
<rect x="48" y="46" width="34" height="2" fill="#f0b56e"/>
<g class="s" fill="#8fb4b8">
<rect x="670" y="27" width="9" height="9" class="rgh"/><text x="685" y="36">ROUGH</text>
<rect x="742" y="27" width="9" height="9" class="bad"/><text x="757" y="36">UNRELIABLE</text>
<rect x="852" y="27" width="9" height="9" class="off"/><text x="867" y="36">NOT BUILT</text>
</g>

<text x="48" y="78" class="h">IN THE COCKPIT</text><path d="M178 74H340" stroke="#17333c"/><text x="472" y="78" class="h" text-anchor="end">DONE VS 1.0</text>
<text x="528" y="78" class="h">OVER THE FRONT</text><path d="M658 74H820" stroke="#17333c"/><text x="952" y="78" class="h" text-anchor="end">DONE VS 1.0</text>

<!-- bars: track, then value (width = percent x 1.6) -->
<g mask="url(#segs)">
<rect class="tr" x="206" y="98" width="160" height="10"/><rect class="g rgh" x="206" y="98" width="96" height="10"/>
<rect class="tr" x="206" y="138" width="160" height="10"/><rect class="g rgh" x="206" y="138" width="88" height="10" style="animation-delay:.06s"/>
<rect class="tr" x="206" y="178" width="160" height="10"/><rect class="g rgh" x="206" y="178" width="88" height="10" style="animation-delay:.12s"/>
<rect class="tr" x="206" y="218" width="160" height="10"/><rect class="g rgh" x="206" y="218" width="96" height="10" style="animation-delay:.18s"/>
<rect class="tr" x="206" y="258" width="160" height="10"/><rect class="g rgh" x="206" y="258" width="72" height="10" style="animation-delay:.24s"/>
<rect class="tr" x="206" y="298" width="160" height="10"/><rect class="g rgh" x="206" y="298" width="40" height="10" style="animation-delay:.3s"/>
<rect class="tr" x="206" y="338" width="160" height="10"/><rect class="g rgh" x="206" y="338" width="56" height="10" style="animation-delay:.36s"/>

<rect class="tr" x="686" y="98" width="160" height="10"/><rect class="g rgh" x="686" y="98" width="88" height="10" style="animation-delay:.03s"/>
<rect class="tr" x="686" y="138" width="160" height="10"/><rect class="g rgh" x="686" y="138" width="72" height="10" style="animation-delay:.09s"/>
<rect class="tr" x="686" y="178" width="160" height="10"/><rect class="g rgh" x="686" y="178" width="56" height="10" style="animation-delay:.15s"/>
<rect class="tr" x="686" y="218" width="160" height="10"/><rect class="g rgh" x="686" y="218" width="64" height="10" style="animation-delay:.21s"/>
<rect class="tr" x="686" y="258" width="160" height="10"/><rect class="g rgh" x="686" y="258" width="40" height="10" style="animation-delay:.27s"/>
<rect class="tr" x="686" y="298" width="160" height="10"/><rect class="g bad" x="686" y="298" width="32" height="10" style="animation-delay:.33s"/>
<rect class="tr" x="686" y="338" width="160" height="10"/><rect class="g off" x="686" y="338" width="16" height="10" style="animation-delay:.39s"/>

<rect class="tr" x="206" y="388" width="640" height="10"/>
</g>
<g clip-path="url(#frame)"><svg x="206" y="388" width="640" height="10" overflow="hidden"><rect class="march" x="-10" width="660" height="10" fill="url(#hatchF)"/></svg></g>

<!-- left column -->
<text x="48" y="108" class="n">WING / WMC</text><text x="48" y="123" class="d">wingmen, formations, loadouts, orders</text><text x="378" y="108" class="s rgh">60%</text>
<text x="48" y="148" class="n">TAC BOARD HUD</text><text x="48" y="163" class="d">visor layout, scope pages, holo map</text><text x="378" y="148" class="s rgh">55%</text>
<text x="48" y="188" class="n">C RING</text><text x="48" y="203" class="d">ten categories, keyboard, mouse or stick</text><text x="378" y="188" class="s rgh">55%</text>
<text x="48" y="228" class="n">WEATHER</text><text x="48" y="243" class="d">skies, storms, MET OFFICE console</text><text x="378" y="228" class="s rgh">60%</text>
<text x="48" y="268" class="n">PILOT IMMERSION</text><text x="48" y="283" class="d">body, G cues, night vision, voices</text><text x="378" y="268" class="s rgh">45%</text>
<text x="48" y="308" class="n">RADIO NETS</text><text x="48" y="323" class="d">rebuilt, not played through yet</text><text x="378" y="308" class="s rgh">25%</text>
<text x="48" y="348" class="n">VANGUARD</text><text x="48" y="363" class="d">eleven systems, more weapons in 0.4</text><text x="378" y="348" class="s rgh">35%</text>

<!-- right column -->
<text x="528" y="108" class="n">FIRE + DESTRUCTION</text><text x="528" y="123" class="d">fires, wrecks, ruins, craters</text><text x="858" y="108" class="s rgh">55%</text>
<text x="528" y="148" class="n">TOWNS + TRENCHES</text><text x="528" y="163" class="d">garrisons, rooftop nests, trench lines</text><text x="858" y="148" class="s rgh">45%</text>
<text x="528" y="188" class="n">STR COMMAND MAP</text><text x="528" y="203" class="d">SEND WING in, wave desk not built</text><text x="858" y="188" class="s rgh">35%</text>
<text x="528" y="228" class="n">OPS FRONTS</text><text x="528" y="243" class="d">SPACE / CYBER / SOF, finished in 0.3</text><text x="858" y="228" class="s rgh">40%</text>
<text x="528" y="268" class="n">AIRBORNE</text><text x="528" y="283" class="d">HALO jumps, fast-rope, rappel</text><text x="858" y="268" class="s rgh">25%</text>
<text x="528" y="308" class="n">MULTIPLAYER</text><text x="528" y="323" class="d">same version for everyone, host-heavy</text><text x="858" y="308" class="s bad">20%</text>
<text x="528" y="348" class="n">CAMPAIGN</text><text x="528" y="363" class="d">mission scripts only, the war in 0.9</text><text x="858" y="348" class="s off">10%</text>

<!-- the Flying Fortress, 0.7 -->
<path d="M48 376H952" stroke="#17333c"/>
<text x="48" y="398" class="n" style="fill:#f6c88f">FLYING FORTRESS</text>
<text x="858" y="398" class="s bad flicker">CLASSIFIED</text>
</svg>
